<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="video-title video-desc">
  <title id="video-title">Clinical Video and Reels Production Concept Board</title>
  <desc id="video-desc">Architectural storyboard and vertical reel frame layout for Dr. Kavitha Nair Preventive Cardiology concept project.</desc>
  <rect width="800" height="600" fill="#172C38"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#A8BFB2" stroke-opacity="0.3" stroke-width="1"/>
  <text x="64" y="84" fill="#A8BFB2" font-family="Manrope, sans-serif" font-size="13" font-weight="700" letter-spacing="3">VIDEO &amp; REELS · CONCEPT STORYBOARD</text>
  <text x="64" y="120" fill="#F7F5EF" font-family="Manrope, sans-serif" font-size="28" font-weight="700">Dr. Kavitha Nair — Clinical Series</text>

  <!-- Vertical 9:16 Reel Frame Mockup -->
  <rect x="64" y="156" width="232" height="372" rx="4" fill="#F7F5EF"/>
  <rect x="78" y="170" width="204" height="278" fill="#303B40"/>
  <circle cx="180" cy="264" r="42" fill="#A8BFB2" fill-opacity="0.25" stroke="#A8BFB2" stroke-width="1.5"/>
  <path d="M168 248 L200 264 L168 280 Z" fill="#C99A72"/>
  <rect x="94" y="384" width="172" height="44" fill="#172C38" fill-opacity="0.92"/>
  <rect x="94" y="384" width="3" height="44" fill="#C99A72"/>
  <text x="108" y="403" fill="#F7F5EF" font-family="Manrope, sans-serif" font-size="11" font-weight="700">PREVENTIVE CARDIOLOGY</text>
  <text x="108" y="418" fill="#A8BFB2" font-family="DM Sans, sans-serif" font-size="10">01 · Blood Pressure Clarity</text>
  <text x="80" y="476" fill="#172C38" font-family="Manrope, sans-serif" font-size="12" font-weight="700">9:16 DOCTOR-APPROVED REEL</text>
  <text x="80" y="496" fill="#303B40" font-family="DM Sans, sans-serif" font-size="11">45s · Natural studio key light</text>

  <!-- Storyboard Sequence Cards -->
  <rect x="332" y="156" width="404" height="110" fill="#303B40" fill-opacity="0.55" stroke="#A8BFB2" stroke-opacity="0.35"/>
  <text x="356" y="188" fill="#C99A72" font-family="Manrope, sans-serif" font-size="12" font-weight="700" letter-spacing="2">01 · OPENING HOOK (00:00–00:06)</text>
  <text x="356" y="216" fill="#F7F5EF" font-family="DM Sans, sans-serif" font-size="15">Calm clinical introduction addressing one patient question</text>
  <text x="356" y="240" fill="#A8BFB2" font-family="DM Sans, sans-serif" font-size="13">No sensational claims · Clear eye-level framing</text>

  <rect x="332" y="286" width="404" height="110" fill="#303B40" fill-opacity="0.55" stroke="#A8BFB2" stroke-opacity="0.35"/>
  <text x="356" y="318" fill="#C99A72" font-family="Manrope, sans-serif" font-size="12" font-weight="700" letter-spacing="2">02 · EDUCATIONAL EXPLANATION (00:06–00:36)</text>
  <text x="356" y="346" fill="#F7F5EF" font-family="DM Sans, sans-serif" font-size="15">Structured takeaways with accessible on-screen typography</text>
  <text x="356" y="370" fill="#A8BFB2" font-family="DM Sans, sans-serif" font-size="13">Doctor-reviewed script · Subtitles for silent viewing</text>

  <rect x="332" y="416" width="404" height="112" fill="#A8BFB2" fill-opacity="0.16" stroke="#C99A72" stroke-opacity="0.6"/>
  <text x="356" y="448" fill="#C99A72" font-family="Manrope, sans-serif" font-size="12" font-weight="700" letter-spacing="2">03 · CONSULTATION DIRECTION (00:36–00:48)</text>
  <text x="356" y="476" fill="#F7F5EF" font-family="DM Sans, sans-serif" font-size="15">Informed next step &amp; clinic appointment guidance</text>
  <text x="356" y="500" fill="#A8BFB2" font-family="DM Sans, sans-serif" font-size="13">Ethical communication · Patient privacy respected</text>
</svg>

